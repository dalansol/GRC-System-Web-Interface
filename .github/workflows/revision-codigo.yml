name: Revisión de código

on:
  pull_request:
    branches: [master]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint (frontend y backend)
        run: npm run lint

      - name: Prettier (solo archivos cambiados en el pull request)
        # Por ahora solo avisa, no bloquea. Quitar esta línea cuando todos usen Prettier.
        continue-on-error: true
        run: npm run format:check
        env:
          RAMA_BASE: origin/${{ github.base_ref }}
